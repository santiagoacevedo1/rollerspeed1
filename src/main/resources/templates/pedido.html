<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/floristeria}">Floristeria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#floristeriaNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="floristeriaNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/floristeria/tipo-flor}">Tipo de Flor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/floristeria/arreglo-floral}">Arreglo Floral</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/floristeria/pedido}">Pedido</a>
                    </li>
                </ul>
                <a class="btn btn-outline-light" th:href="@{/home/principal}">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Pedidos</h2>
            <a th:href="@{/floristeria/pedido/nuevo}" class="btn btn-success">+ Nuevo Pedido</a>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Arreglo Floral</th>
                    <th>Cantidad</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}"></td>
                    <td th:text="${pedido.cliente}"></td>
                    <td th:text="${pedido.arregloFloral.nombre}"></td>
                    <td th:text="${pedido.cantidad}"></td>
                    <td th:text="${pedido.fechaPedido}"></td>
                    <td>
                        <span class="badge" th:classappend="${pedido.estado == 'Entregado'} ? 'bg-success' : (${pedido.estado == 'En proceso'} ? 'bg-warning' : 'bg-secondary')" th:text="${pedido.estado}"></span>
                    </td>
                    <td>
                        <a th:href="@{/floristeria/pedido/editar/{id}(id=${pedido.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/floristeria/pedido/eliminar/{id}(id=${pedido.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Estas seguro de eliminar este pedido?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="7" class="text-center">No hay pedidos registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
