<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pedido.id != null} ? 'Editar Pedido' : 'Nuevo Pedido'">Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/floristeria}">Floristeria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#floristeriaNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="floristeriaNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/floristeria/tipo-flor}">Tipo de Flor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/floristeria/arreglo-floral}">Arreglo Floral</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/floristeria/pedido}">Pedido</a>
                    </li>
                </ul>
                <a class="btn btn-outline-light" th:href="@{/home/principal}">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${pedido.id != null} ? 'Editar Pedido' : 'Nuevo Pedido'"></h2>

        <form th:action="@{/floristeria/pedido/guardar}" th:object="${pedido}" method="post" class="mt-3" style="max-width: 500px;">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{fechaPedido}">

            <div class="mb-3">
                <label for="cliente" class="form-label">Cliente</label>
                <input type="text" class="form-control" id="cliente" th:field="*{cliente}" required>
            </div>

            <div class="mb-3">
                <label for="arregloFloral" class="form-label">Arreglo Floral</label>
                <select class="form-select" id="arregloFloral" th:field="*{arregloFloral.id}" required>
                    <option value="">Seleccione un arreglo floral</option>
                    <option th:each="arreglo : ${arreglosFlorales}" th:value="${arreglo.id}" th:text="${arreglo.nombre}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" th:field="*{cantidad}" min="1" required>
            </div>

            <div class="mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado" th:field="*{estado}">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Entregado">Entregado</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/floristeria/pedido}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
