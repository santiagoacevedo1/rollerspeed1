<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${arregloFloral.id != null} ? 'Editar Arreglo Floral' : 'Nuevo Arreglo Floral'">Arreglo Floral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/floristeria}">Floristeria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#floristeriaNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="floristeriaNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/floristeria/tipo-flor}">Tipo de Flor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/floristeria/arreglo-floral}">Arreglo Floral</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/floristeria/pedido}">Pedido</a>
                    </li>
                </ul>
                <a class="btn btn-outline-light" th:href="@{/home/principal}">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${arregloFloral.id != null} ? 'Editar Arreglo Floral' : 'Nuevo Arreglo Floral'"></h2>

        <form th:action="@{/floristeria/arreglo-floral/guardar}" th:object="${arregloFloral}" method="post" class="mt-3" style="max-width: 500px;">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripcion</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required>
            </div>

            <div class="mb-3">
                <label for="tipoFlor" class="form-label">Tipo de Flor</label>
                <select class="form-select" id="tipoFlor" th:field="*{tipoFlor.id}" required>
                    <option value="">Seleccione un tipo de flor</option>
                    <option th:each="tf : ${tiposFlor}" th:value="${tf.id}" th:text="${tf.nombre}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/floristeria/arreglo-floral}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
